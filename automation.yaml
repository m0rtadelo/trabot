# 3. Automation — add to automations.yaml
# -------------------------------------------------------------------
- id: trading_bot_hourly_analysis
  alias: "Trading Bot - Hourly Analysis"
  description: "Trigger one analysis cycle every hour during US market hours."
  trigger:
    - platform: time_pattern
      minutes: "/60"
  condition:
    - condition: time
      after: "09:30:00"
      before: "16:00:00"
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
    - condition: template
      value_template: >
        {{ not is_state('sensor.trading_last_run_status', 'error') or
           now() - states.sensor.trading_last_run_status.last_changed > timedelta(minutes=30) }}
  action:
    - service: rest_command.trading_bot_run
      data: {}
    - delay:
        seconds: 5
    - service: notify.notify
      data:
        title: "Trading Bot"
        message: >
          Analysis complete.
          Status: {{ state_attr('sensor.trading_last_run_status', 'status') | default('unknown') }}
          Value: ${{ states('sensor.trading_portfolio_value') | default('0') }}
          P&L: ${{ states('sensor.trading_realized_pnl') | default('0') }}
  mode: single
